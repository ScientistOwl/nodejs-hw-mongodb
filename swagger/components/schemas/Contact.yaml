type: object
properties:
  _id:
    type: string
    example: '60d0fe4f5311236168a109ca'
  name:
    type: string
    example: 'Alice Smith'
  phoneNumber:
    type: string
    example: '+380123456789'
  email:
    type: string
    example: 'alice@example.com'
  contactType:
    type: string
    enum: [work, home, personal]
    example: 'personal'
  isFavourite:
    type: boolean
    example: false
  photo:
    type: string
    example: 'https://res.cloudinary.com/demo/image/upload/photo.jpg'
  userId:
    type: string
    example: '60d0fe4f5311236168a10999'
