type: object
properties:
  name:
    type: string
    minLength: 3
    maxLength: 20
    example: 'Alice Smith'
  phoneNumber:
    type: string
    minLength: 3
    maxLength: 20
    example: '+380123456789'
  email:
    type: string
    minLength: 3
    maxLength: 20
    example: 'alice@example.com'
  contactType:
    type: string
    enum: [work, home, personal]
    example: 'personal'
  isFavourite:
    type: boolean
    example: true
  photo:
    type: string
    format: binary
