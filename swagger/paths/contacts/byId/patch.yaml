tags:
  - Contacts
summary: Update a contact by ID
operationId: updateContact
description: Modify contact fields and optionally upload a new photo
security:
  - bearerAuth: []

parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
      example: 60d0fe4f5311236168a109ca

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: ../../../components/schemas/UpdateContact.yaml

responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          $ref: ../../../components/responses/ContactResponse.yaml
  '400':
    $ref: ../../../components/responses/BadRequest.yaml
  '401':
    $ref: ../../../components/responses/Unauthorized.yaml
  '404':
    $ref: ../../../components/responses/NotFound.yaml
