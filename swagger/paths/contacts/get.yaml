tags:
  - Contacts
summary: Get all contacts
description: Retrieve paginated contacts
operationId: getContacts
security:
  - bearerAuth: []

parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      example: 1
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      example: 10
  - name: favorite
    in: query
    required: false
    schema:
      type: boolean
      example: true

responses:
  '200':
    description: Paginated contact list
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: 'Contacts retrieved successfully'
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            contacts:
              type: array
              items:
                $ref: ../../components/schemas/Contact.yaml
  '401':
    $ref: ../../components/responses/Unauthorized.yaml
