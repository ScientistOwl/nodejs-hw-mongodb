tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve the full list of contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      example: 1
    description: Page number for paginated results
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      example: 10
    description: Number of contacts per page
  - name: favorite
    in: query
    required: false
    schema:
      type: boolean
      example: true
    description: Filter contacts by favorite status
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../components/schemas/Contact.yaml
  '401':
    description: Unauthorized access
    content:
      application/json:
        schema:
          $ref: ../../components/responses/Unauthorized.yaml
