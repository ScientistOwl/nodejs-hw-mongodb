tags:
  - Contacts
summary: Get all contacts with pagination
operationId: getContacts
description: Retrieve paginated list of user contacts
security:
  - bearerAuth: []

parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      example: 1
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      example: 10
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      example: name
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
      example: asc
  - name: type
    in: query
    required: false
    schema:
      type: string
      enum: [work, home, personal]
      example: personal
  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
      example: true

responses:
  '200':
    description: Contacts retrieved successfully
    content:
      application/json:
        schema:
          $ref: ../../components/responses/PaginatedContacts.yaml
  '401':
    $ref: ../../components/responses/Unauthorized.yaml
