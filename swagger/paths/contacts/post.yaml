tags:
  - Contacts
summary: Create new contact
description: Add a new contact with image
operationId: createContact
security:
  - bearerAuth: []

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
          phone:
            type: string
          avatar:
            type: string
            format: binary

responses:
  '201':
    description: Contact created
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: 'Contact created successfully'
            contact:
              $ref: ../../components/schemas/Contact.yaml
  '400':
    $ref: ../../components/responses/BadRequest.yaml
  '401':
    $ref: ../../components/responses/Unauthorized.yaml
