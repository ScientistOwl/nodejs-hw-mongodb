tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact with optional photo
security:
  - bearerAuth: []

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: ../../components/schemas/NewContact.yaml

responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: ../../components/responses/ContactResponse.yaml
  '400':
    $ref: ../../components/responses/BadRequest.yaml
  '401':
    $ref: ../../components/responses/Unauthorized.yaml
