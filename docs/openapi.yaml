openapi: 3.1.0

info:
  version: 1.0.0
  title: Contact Management API
  description: API for managing contacts, with authentication and pagination.

tags:
  - name: Contacts
    description: Operations with contacts

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-1-zsii.onrender.com/

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/byId/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/byId/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/byId/delete.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
