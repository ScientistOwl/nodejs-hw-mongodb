openapi: 3.1.0

info:
  version: 1.0.0
  title: Contact Management API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: REST API for contact management with authentication, pagination, and image upload

tags:
  - name: Contacts
    description: CRUD and filters
  - name: Auth
    description: Registration, login, session, email reset
  - name: Users
    description: User profile and avatar

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-1-zsii.onrender.com

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/byId/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/byId/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/byId/delete.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
